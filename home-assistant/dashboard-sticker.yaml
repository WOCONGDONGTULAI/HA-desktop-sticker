# HA 贴纸专用仪表盘
# 实体已按 192.168.5.18 那台 HA 的实际设备填好（电暖器 / 热水器 / 电脑 / 牌匾灯 /
# 充电器 / 闪光灯插座 + 阁楼空调 + 小米净化器 + 温湿度计 + 在家状态）
#
# 装法二选一：
#   1) 自动：python3 create_sticker_dashboard.py --url http://192.168.5.18:8123 --token <长期令牌>
#   2) 手动：设置 → 仪表盘 → 新增仪表盘 → URL 路径填 ha-sticker（必须带 -，见 README）
#            → ⋮ → 编辑仪表盘 → ⋮ → 原始配置编辑器 → 整段粘贴
#
# ⚠️ 仪表盘 URL 路径必须含连字符（-），写成 sticker 会被 HA 拒绝，访问就是 404。
#
# 贴纸地址：http://192.168.5.18:8123/ha-sticker?kiosk

title: 贴纸
views:
  - title: 贴纸
    path: main
    icon: mdi:sticker
    panel: true
    cards:
      # ---------- 1. 常用插座 / 电器（2 列大按钮，点一下就切）----------
      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            name: 电暖器
            icon: mdi:radiator
            tap_action:
              action: toggle
            entity: switch.yutai_fsov7m_9a4f_switch
          - type: button
            name: 热水器
            icon: mdi:water-boiler
            tap_action:
              action: toggle
            entity: switch.yutai_fsov7m_5ac9_switch
          - type: button
            name: 电脑
            icon: mdi:desktop-tower-monitor
            tap_action:
              action: toggle
            entity: switch.pzg_0002_069f_switch
          - type: button
            name: 牌匾灯
            icon: mdi:led-strip-variant
            tap_action:
              action: toggle
            entity: switch.cuco_v3_3d3f_switch
          - type: button
            name: 充电器
            icon: mdi:battery-charging
            tap_action:
              action: toggle
            entity: switch.yutai_fsov7m_778d_switch
          - type: button
            name: 闪光灯
            icon: mdi:camera-flash
            tap_action:
              action: toggle
            entity: switch.yutai_fsov7m_6938_switch

      # ---------- 2. 阁楼空调 ----------
      - type: entities
        title: 阁楼空调
        show_header_toggle: false
        entities:
          - entity: climate.ge_lou_wen_kong
            name: 温控
          - entity: input_boolean.kong_diao_zong_kong_kai_guan
            name: 空调总控

      # ---------- 3. 空气净化器 + PM2.5 ----------
      - type: entities
        title: 空气净化器
        show_header_toggle: false
        entities:
          - entity: fan.zhimi_rma3_94e5_air_purifier
            name: 净化器开关
          - entity: sensor.zhimi_rma3_94e5_pm25_density
            name: PM2.5

      # ---------- 4. 环境一眼看 ----------
      - type: glance
        title: 家里现在
        show_state: true
        columns: 3
        entities:
          - entity: sensor.miaomiaoce_t2_568c_temperature
            name: 温度
          - entity: sensor.miaomiaoce_t2_568c_relative_humidity
            name: 湿度
          - entity: weather.forecast_wo_de_jia
            name: 天气

      # ---------- 5. 谁在家 ----------
      - type: glance
        title: 谁在家
        show_state: true
        columns: 2
        entities:
          - entity: person.min
            name: MIN
          - entity: device_tracker.xiao_min_de_iphone_15
            name: iPhone 15
